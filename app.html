<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HazelHollow</title>
  <meta name="theme-color" content="#f7f0e3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HazelHollow">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="images/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body">
  <!-- Small top bar -->
  <header class="site-header" style="max-width:34rem">
    <a class="logo" href="index.html"><img src="images/hazelnut.svg" alt="" width="30" height="30"><span>HazelHollow</span></a>
    <span id="top-pills"></span>
  </header>

  <!-- Each "screen" is filled in by js/app.js. Only one shows at a time. -->
  <main class="app-wrap">
    <section class="screen" id="screen-setup" hidden></section>
    <section class="screen" id="screen-home" hidden></section>
    <section class="screen" id="screen-log" hidden></section>
    <section class="screen" id="screen-jar" hidden></section>
    <section class="screen" id="screen-me" hidden></section>
    <section class="screen" id="screen-pro" hidden></section>
    <section class="screen" id="screen-hub" hidden></section>
    <section class="screen" id="screen-split" hidden></section>
    <section class="screen" id="screen-import" hidden></section>
    <section class="screen" id="screen-style" hidden></section>
    <section class="screen" id="screen-recap" hidden></section>
  </main>

  <!-- Bottom tabs, like a phone app -->
  <nav class="tabbar" id="tabbar" aria-label="App">
    <button data-tab="home">Home</button>
    <button data-tab="log">Log</button>
    <button data-tab="jar">Jar</button>
    <button data-tab="me">Me</button>
  </nav>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/site.js"></script>
  <script src="js/budget.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/squirrel.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
